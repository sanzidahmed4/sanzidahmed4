<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="Mission Log"><title>Mission Log</title><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00f5a0"/><stop offset=".5" stop-color="#00d9f5"/><stop offset="1" stop-color="#a855f7"/></linearGradient><linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#00d9f5" stop-opacity=".8"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></linearGradient><filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter></defs><style>text{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}@keyframes run{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(668px);opacity:0}}.dot{animation:run 4.5s cubic-bezier(.5,0,.5,1) infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.dia{animation:pulse 2s infinite}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><rect class="dia" x="4" y="17" width="12" height="12" transform="rotate(45 10 23)" fill="url(#grad)"/><text x="26" y="30" font-size="18" font-weight="700" fill="url(#grad)" letter-spacing="1">01 ── MISSION LOG</text><line x1="216" y1="23" x2="900" y2="23" stroke="url(#fade)" stroke-width="1.5"/><g class="dot"><circle cx="216" cy="23" r="5" fill="#00d9f5" filter="url(#gl)"/><circle cx="216" cy="23" r="2" fill="#fff"/></g></svg>
